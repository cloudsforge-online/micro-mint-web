# Forge Create's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# It matters more on this surface than on most. `/projects/<uuid>` is a PUBLIC, shareable address
# — pasted into chats, posted, crawled — and a mistyped one answering 200 is a page a prospective
# buyer can be sent to and believe.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# this file is installed as /etc/nginx/conf.d/default.conf (Dockerfile:67), which is included in
# http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/sitemap.test.ts reads that export and
# fails if this alternation has drifted from it. They are the words that name an environment rather
# than a surface: `surfaces.ts` reserves them so that no surface may take one as a subdomain, and
# `deploy/scripts/check-apex-prefix.py` enforces that.
#
# Both hostname shapes are matched, and both are real. The environment is a SUFFIX on the first
# label now — `create-testnet.<apex>` — and was an apex prefix before — `testnet.<apex>`, which is
# the shape the apex surface still has to use on a non-mainnet estate because it has no subdomain
# to suffix. `(?:[^.]+-)?` is what catches the first while `(?:testnet|…)\.` catches the second.
#
# ── WHAT IT IS FOR ─────────────────────────────────────────────────────────────────────────────
#
# A non-mainnet environment is not a thing to be indexed at all. It answers `Disallow: /` and
# serves no sitemap. That is the stronger position on its own merits rather than a workaround: a
# testnet estate carries test EMBER, a faucet and deliberately broken states, and this surface in
# particular would be publishing test-token project pages — pages whose entire purpose is to be
# read by a prospective buyer — into a search index beside the real ones. That is a support
# problem before it is an SEO problem.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is a public product surface with legitimate same-origin
    # embeds inside Hub, unlike the operator console, which has none and uses DENY.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(launch|tokens|projects)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host --------------------
    #
    # They are here rather than in public/ because a sitemap must carry ABSOLUTE URLs — the spec
    # requires it and a crawler discards a relative `<loc>` — and nothing built in this repository
    # is allowed to name a hostname: one image is served from localhost, from a preview deployment
    # and from `create.<apex>`. nginx is the component that knows, because it has `$host` on every
    # request, so the addresses below are composed per request and the artefact stays
    # environment-free. test/sitemap.test.ts asserts that no hostname appears here at all.
    #
    # ── THIS SURFACE IS NOT THE APEX, AND THAT DECIDES WHAT GOES IN ────────────────────────────
    #
    # `site/nginx.conf` serves the ESTATE sitemap — every sibling composed as `<subdomain>.$host` —
    # and it may do that because its `$host` IS the apex. Here `$host` is already `create.<apex>`,
    # so the same generator would compose `foresight.create.cloudsforge.online`: a three-label name
    # nothing serves, which Cloudflare's one-label wildcard certificate cannot even complete a TLS
    # handshake for. A sitemap of addresses that cannot be connected to is worse than no sitemap,
    # because a crawler handed dead URLs by a site's own index discounts the ones that work.
    #
    # So this lists THIS SURFACE'S OWN PUBLIC ROUTES and nothing else. That is one address.
    #
    # `/` — the catalogue. `ROUTES` in src/lib/routes.ts marks it `public: true`, and it is public
    # because the service made it so: `GET /v1/catalogue` makes no `authenticate()` call.
    #
    # `/launch`, `/tokens` and `/tokens/<uuid>` are absent because they are gated: a crawler
    # following them reaches a sign-in redirect. `DocumentMeta` in the shell sends `noindex` for
    # the same three, which is the same decision made twice on purpose — a sitemap is an invitation
    # and a robots directive is an instruction, and the two must not disagree.
    #
    # `/projects/<uuid>` IS public, and is deliberately not listed. It is the one address this
    # product exists to have read, but the set of them is unbounded and knowable only to the
    # service; nginx has no list to enumerate and inventing a `/projects` index would be a sitemap
    # entry for an address that renders the not-found page. They are discovered from the links
    # people share, which is how a project page is reached in the first place. Listing the surface
    # they live on is what a sitemap can honestly say here.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # Restated in full, per the rule stated in `location /assets/` above: add_header is
        # all-or-nothing per level, so a location declaring any header inherits none.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    #
    # There is no `public/robots.txt` and there must never be one: the exact-match location above
    # wins over this prefix, so such a file would be in the repository, deployed, and unreachable —
    # the worst of the three states, because the next reader edits it and nothing happens.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the product works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
