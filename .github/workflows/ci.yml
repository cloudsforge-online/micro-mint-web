# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE `check` AND `image` JOBS BELOW ARE TEMPORARY, exactly as they are in `micro-admin-web` and
# `micro-hub-web`. The org's reusable `web-ci.yml` is the target and the `hygiene` job already calls
# the org repository; the two local jobs exist for one reason and disappear with it:
#
#   @cloudsforge/ui is unpublished, and this repository consumes it as `link:../ui/packages/ui`.
#   The reusable workflow does a single checkout and then `pnpm install --frozen-lockfile`, which
#   cannot resolve a sibling directory that is not there. The day the design system is published
#   and the specifier in package.json becomes `^1.0.0`, everything from `check:` to the end of
#   `image:` is deleted and replaced by:
#
#     jobs:
#       ci:
#         uses: cloudsforge-online/micro-org/.github/workflows/web-ci.yml@main
#         with:
#           app: mint-web
#           deep-link-path: /tokens/5c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
#         permissions:
#           contents: read
#           packages: read
#
#   — the calling convention in `org/templates/web/_github/workflows/ci.yml`. The measured target
#   in docs/ecosystem/03 §5 is zero repositories with a bespoke CI file, so treat every line from
#   `check:` down as a liability with a deletion date rather than as something to extend.
#
# ONE INPUT OF THE REUSABLE WORKFLOW WILL STILL NOT SUIT THIS REPOSITORY: its `image` job probes a
# deep route and requires a 200 for ANY address. This app's nginx.conf enumerates its real routes
# and answers 404 for everything else ON PURPOSE — which matters more here than anywhere, because
# `/projects/<uuid>` is a public address people are SENT. So `build-image: false` will be passed and
# the image is checked here, where the probe can assert the honest answer as well as the deep link.
#
# `deep-link-path` is `/tokens/<uuid>` — a REAL route, declared as a wildcard in
# `src/lib/routes.ts` and exported as `DEEP_LINK_PATH`, which `test/routes.test.ts` checks this
# file against. A probe against a path the app does not own proves only that the 404 page renders.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: mint-web }

      # Temporary, for the same reason as the Dockerfile's second build context: the design system
      # is unpublished and resolves through `link:../ui/packages/ui`.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          # micro-ui is private; without a contents:read token this checkout 404s and the job dies
          # before install. Same wiring as the service repos' runtime checkout.
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # ══════════════════════════════════════════════════════════════════════════════════════════
      # THE SERVICE THIS CLIENT IS BUILT AGAINST, CHECKED OUT SO THE CITATIONS CAN BE VERIFIED.
      #
      # `test/mint.test.ts` reads `mint/src/server.ts` and requires that every route this bundle
      # calls is registered at the line its citation names, that the two routes called without a
      # bearer really make no `authenticate()` call, and that mint still requires no
      # `Idempotency-Key`. Seven clients in this estate were built against a surface somebody
      # imagined; one made every on-chain escrow activation fail with a false diagnosis.
      #
      # Only `src/` is fetched — the citations are line numbers in source, and nothing here builds
      # or runs the service.
      # ══════════════════════════════════════════════════════════════════════════════════════════
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-mint
          path: mint
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src

      # Pinned, because the checkout lives at mint-web/ and the action looks for the packageManager
      # field in the workspace root, where there is no package.json.
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: mint-web/pnpm-lock.yaml }

      # `link:` resolves to the sibling's own node_modules, so the design system must be installed
      # before this repository is — without this, `tsc` cannot resolve ../ui's own imports (react,
      # react/jsx-runtime) when it typechecks the linked sources.
      - name: Install the sibling design system
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install
        working-directory: mint-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: mint-web
        run: pnpm typecheck

      - name: Test
        working-directory: mint-web
        run: pnpm test

      # ── The route cross-check must have RUN, not merely not failed ────────────────────────────
      #
      # `test/mint.test.ts` skips its cross-repository half when there is no micro-mint checkout,
      # so that `pnpm test` passes for somebody who cloned only this repository. A skipped test is
      # an unmeasured one, so on the runner the absence has to be fatal — otherwise a checkout that
      # silently produced nothing would look exactly like a client whose citations are all correct.
      - name: The citations were checked against the real service
        working-directory: mint-web
        run: |
          set -euo pipefail
          test -f ../mint/src/server.ts || {
            echo "::error::micro-mint was not checked out; the route citations were never verified"
            exit 1
          }
          out=$(node --import tsx --test test/mint.test.ts 2>&1 || true)
          if printf '%s\n' "$out" | grep -q 'SKIPPED: no micro-mint checkout'; then
            echo "::error::the route cross-check skipped itself while micro-mint was present"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'is registered at mint/src/server.ts:340' || {
            echo "::error::the route cross-check did not run against mint/src/server.ts"
            exit 1
          }
          echo "ok: every cited route was verified against the service that serves it"

      # …and the cross-check can fail. Bend one citation and require the suite to go red, so a
      # `mint.test.ts` reduced to assertions that always pass cannot look like a verified client.
      - name: …and it would have noticed a wrong citation
        working-directory: mint-web
        run: |
          set -euo pipefail
          cp test/mint.test.ts "$RUNNER_TEMP/mint.test.ts.orig"
          sed -i "s|path: '/v1/catalogue', line: 340|path: '/v1/catalogue', line: 341|" test/mint.test.ts
          if node --import tsx --test test/mint.test.ts >/dev/null 2>&1; then
            echo "::error::the cross-check passed a citation off by one line — it is not reading the service"
            cp "$RUNNER_TEMP/mint.test.ts.orig" test/mint.test.ts
            exit 1
          fi
          cp "$RUNNER_TEMP/mint.test.ts.orig" test/mint.test.ts
          echo "ok: a citation off by one line turns the suite red, so a pass is evidence"

      - name: Build
        working-directory: mint-web
        run: pnpm build

      # A frontend that builds to nothing is a blank page, not a build failure. The previous estate
      # served SPAs from the API process and shipped an image with no dist in it.
      - name: The bundle exists
        working-directory: mint-web
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html is missing after a successful build"; exit 1; }
          echo "ok: $(find dist -type f | wc -l | tr -d ' ') files in dist"

      # The brand chrome must survive the BUILD as well as be present in the source tree.
      # test/brand-chrome.test.ts asserts the source; this asserts the artefact, because Vite copies
      # publicDir at build time and a misconfigured publicDir would pass the first and fail the
      # second. The og card is in the list: on this surface a missing one is a blank preview on
      # every shared project page.
      - name: The brand chrome reached the bundle
        working-directory: mint-web
        run: |
          set -euo pipefail
          for asset in favicon-32x32.png favicon-192x192.png favicon-512x512.png og-1200x630.png; do
            test -f "dist/$asset" || { echo "::error::dist/$asset is missing from the build output"; exit 1; }
          done
          echo "ok: the favicons and the og card are in dist"

  rules:
    name: Estate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build-time configuration
        # The same rule as test/no-build-time-config.test.ts, checked again here so it fails even
        # if somebody deletes the test along with the line it forbids. A `VITE_` variable is read
        # at build time and frozen into the artefact, and an artefact with an environment frozen
        # into it has to be rebuilt to be promoted — which means the thing that reaches production
        # is not the thing that passed CI.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from cloudsforgeHosts() at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy is
        # the one that will be wrong.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' 'cloudsforge\.online' src; then
            echo "::error::resolve hosts through cloudsforgeHosts() rather than naming them"
            exit 1
          fi
          echo "ok: no literal hostnames in src"

      - name: The SPA fallback keeps its 404
        # Comments are stripped first. nginx.conf's own header QUOTES the directive it forbids, in
        # order to explain why the routes are enumerated by hand, so a grep over the raw file
        # matches the warning and fails a correct config. (The web template's copy of this step
        # does exactly that, and fails on its own pristine nginx.conf.)
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'try_files[[:space:]]+\$uri[[:space:]]+(\$uri/[[:space:]]+)?/index\.html'; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          printf '%s\n' "$directives" | grep -q 'error_page 404 /index.html'
          echo "ok: unknown paths answer 404"

      - name: The auth callback is redeemed before the app renders
        # The hand-off code has to leave the address bar before the exchange goes over the wire,
        # and that only happens if bootstrapSession() runs before React mounts.
        run: grep -q 'bootstrapSession' src/main.tsx

      - name: The route table, the navigation and nginx agree
        # Already asserted by test/routes.test.ts; repeated here so deleting the test does not
        # silently delete the rule.
        run: test -f test/routes.test.ts && grep -q 'nginx.conf' test/routes.test.ts

      - name: Every route this client calls cites the line that serves it
        # The rule test/mint.test.ts enforces, restated so that deleting the test does not delete
        # it. Every `/v1/...` path in the client must appear in a file that also carries a
        # `mint/src/server.ts:<line>` citation.
        run: |
          set -uo pipefail
          paths=$(grep -coE "'/v1/[^']*'" src/lib/mint.ts || true)
          cites=$(grep -coE 'mint/src/server\.ts:[0-9]+' src/lib/mint.ts || true)
          if [ "${cites:-0}" -lt 8 ]; then
            echo "::error::src/lib/mint.ts carries ${cites:-0} route citations; the surface has eight"
            exit 1
          fi
          if grep -rn --include='*.tsx' -E "api<[^>]*>\(\s*[\`'\"]/v1/" src; then
            echo "::error::a page calls /v1 directly; every call goes through src/lib/mint.ts, where it is cited"
            exit 1
          fi
          echo "ok: ${paths:-0} route literals, ${cites:-0} citations, and no uncited call site"

      - name: No act-as-anyone parameter
        # `GET /v1/tokens` honours a `userId` query parameter for an admin principal
        # (mint/src/server.ts:420-421). From a customer bundle it can only ever be the caller's own
        # id or a 403, so exposing it would put an act-as-anyone-shaped control in a product app for
        # no reachable behaviour. deploy/gateway/dynamic/policy.yml refuses the /internal routes
        # that took a userId as a parameter for the same reason.
        run: |
          set -uo pipefail
          if grep -rnE "(onBehalfOf|actAs|impersonat)" --include='*.ts' --include='*.tsx' src; then
            echo "::error::a customer acts as themselves; this app has no act-as primitive"
            exit 1
          fi
          if grep -rnE "searchParams.*userId|query:.*userId" --include='*.ts' --include='*.tsx' src; then
            echo "::error::the userId query parameter is admin-only on mint and must not be sent from here"
            exit 1
          fi
          echo "ok: no act-as-anyone primitive"

      - name: A project page never renders the order record
        # 04-domain-model §5.3, implemented at mint/src/projectpages.ts:1-21: supply, authorities
        # and contract address come from the INDEXER. Falling back to the order would put a false
        # statement about a token in front of a prospective buyer. Also asserted by
        # test/render.test.ts; repeated so deleting the test does not delete the rule.
        run: |
          set -uo pipefail
          if grep -nE 'token\.(supply|cap|contractAddress|decimals)' src/pages/project.tsx; then
            echo "::error::the public project page must read the chain, never the order record"
            exit 1
          fi
          echo "ok: the project page reads the indexer only"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: mint-web }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: mint-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: mint-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PROBED, NOT READ. Both defects this step guards were invisible in the config and obvious in
      # a response: nginx's `add_header` is all-or-nothing per level, so a location that sets
      # Cache-Control silently loses every inherited security header; and `try_files` is a file
      # lookup rather than an internal redirect, so serving /index.html from `location = /` never
      # enters `location = /index.html`. Reading the file suggests both are fine. Curling it does
      # not.
      - name: The image serves the app, 404s what it does not own, and sends the headers it promises
        run: |
          set -uo pipefail
          docker run -d --name ci-mint-web -p 127.0.0.1:8080:8080 mint-web:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for /"; docker logs --tail 60 ci-mint-web; exit 1; }

          fail=0

          # A route this app OWNS must survive a hard refresh. The path is DEEP_LINK_PATH in
          # src/lib/routes.ts, and test/routes.test.ts checks this file against it.
          deep=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/tokens/5c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f || true)
          [ "$deep" = "200" ] || { echo "::error::an owned route returned $deep — it must be served the shell"; fail=1; }

          # The public project page, which is the address people are SENT. Same requirement.
          shared=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/projects/5c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f || true)
          [ "$shared" = "200" ] || { echo "::error::a shared project page returned $shared"; fail=1; }

          # A route it does NOT own must answer 404 while still serving the shell, so the reader
          # gets a real page and the status line tells the truth. This is the assertion the org's
          # reusable image job cannot make, because it requires a 200 for any deep link.
          unknown=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope/not/a/route || true)
          [ "$unknown" = "404" ] || { echo "::error::an unknown address returned $unknown; it must be 404"; fail=1; }
          curl -s -m 5 http://127.0.0.1:8080/nope/not/a/route | grep -q '<div id="root">' \
            || { echo "::error::the 404 did not serve the app shell"; fail=1; }

          check() { # url, header, expected-substring, label
            got=$(curl -sI "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true)
            case "${got:-}" in
              "") echo "::error::$4 is missing $2"; fail=1 ;;
              *"$3"*) echo "  ok   $4: $2: $got" ;;
              *) echo "::error::$4 has the wrong $2 (got '${got:-nothing}', wanted '$3')"; fail=1 ;;
            esac
          }

          asset=$(curl -s http://127.0.0.1:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          for target in "http://127.0.0.1:8080/" "http://127.0.0.1:8080/tokens" "http://127.0.0.1:8080$asset"; do
            [ -n "$asset" ] || [ "$target" != "http://127.0.0.1:8080" ] || continue
            check "$target" X-Content-Type-Options "nosniff" "$target"
            # SAMEORIGIN, not DENY: this is a public product surface with legitimate embeds inside
            # Hub. The operator console is the one that uses DENY, and for a stated reason.
            check "$target" X-Frame-Options "SAMEORIGIN" "$target"
            check "$target" Referrer-Policy "strict-origin" "$target"
          done
          check "http://127.0.0.1:8080/" Cache-Control "no-store" "the shell"
          check "http://127.0.0.1:8080/tokens" Cache-Control "no-store" "an enumerated route"
          [ -n "$asset" ] && check "http://127.0.0.1:8080$asset" Cache-Control "immutable" "a hashed asset"

          # This surface must NOT be kept out of an index: its project pages exist to be found.
          robots=$(curl -sI http://127.0.0.1:8080/ | tr -d '\r' | grep -ci '^X-Robots-Tag:' || true)
          [ "${robots:-0}" = "0" ] || { echo "::error::this public surface sends X-Robots-Tag"; fail=1; }

          # The brand chrome is SERVED by the image, not merely committed to the repository. The web
          # template's Dockerfile does not copy public/ into the build context, so every frontend cut
          # from it ships an image with no icon in it while its own brand test passes — and here that
          # would blank the link preview on every shared project page.
          for asset in favicon-32x32.png favicon-192x192.png og-1200x630.png; do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$asset" || true)
            [ "$code" = "200" ] || { echo "::error::/$asset returned $code from the image"; fail=1; }
          done

          docker rm -f ci-mint-web >/dev/null 2>&1 || true
          exit $fail
      - name: Down
        if: always()
        run: docker rm -f ci-mint-web || true

  hygiene:
    # The org's reusable secret check. Cheap, and it catches the failure that cannot be undone: a
    # secret pushed to a repository is compromised the moment it lands, and rotating it is the only
    # remedy.
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read
